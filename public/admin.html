<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Administration · Danay Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/theme-boot.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ED5D0B">
</head>
<body class="page-admin">

<header class="top"><div class="wrap wide header-dash-wrap">
  <div class="header-dash-left">
    <div class="header-dash-brand">
      <div class="brand">
        <img class="logo" src="assets/logo.jpg" alt="Danay Express SARL" hidden>
        <span class="header-dash-title">Administration</span>
      </div>
    </div>
  </div>

  <div class="header-dash-right">
    <div class="header-company-info">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 9h1M9 13h1M9 17h1M14 9h1M14 13h1M14 17h1"/></svg>
      <span>Danay Express SARL</span>
    </div>

    <span class="sub" id="who"></span>
    <button class="btn btn-logout-dash" type="button" id="logout" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Déconnexion</span>
    </button>
  </div>
</div></header>

<div id="boot" class="loading" role="status">
  <div class="spinner-border text-primary" aria-hidden="true"></div>
  <span class="visually-hidden">Chargement de l'administration…</span>
</div>

<section id="app" hidden>
  <div class="wrap wide dash-main-wrap">
    <div class="banner bad" id="msg" role="alert" hidden></div>

    <!-- Hero Card Danay Express avec visuel Bus -->
    <section class="board dash-hero-banner">
      <div class="dash-hero-content">
        <h1 class="dash-hero-title">Administration <span class="highlight-orange">&amp; Paramètres</span></h1>
        <p class="dash-hero-desc">Gestion du parc de véhicules, des lignes, des agences et des comptes</p>
        <div class="dash-hero-stripe" aria-hidden="true"></div>

        <nav class="tabs dash-tabs" id="tabs" aria-label="Sections">
          <button type="button" data-sec="agences" class="on">Agences</button>
          <button type="button" data-sec="axes">Lignes</button>
          <button type="button" data-sec="sens">Sens</button>
          <button type="button" data-sec="vehicules">Véhicules</button>
          <button type="button" data-sec="chauffeurs">Chauffeurs</button>
          <button type="button" data-sec="fonctions">Fonctions</button>
          <button type="button" data-sec="agents">Utilisateurs</button>
          <button type="button" data-sec="comptes">Comptes</button>
          <button type="button" data-sec="roles">Rôles</button>
          <button type="button" data-sec="messages">Messages</button>
          <button type="button" data-sec="reglages">Réglages</button>
          <button type="button" data-sec="apparence">Apparence</button>
        </nav>

        <h2 id="titre" class="dash-admin-sec-title"></h2>
        <p class="lead" id="aide"></p>
      </div>

      <div class="dash-hero-bus-box">
        <div class="dash-hero-bus-overlay"></div>
        <img class="dash-bus-image" src="assets/bus.jpg" alt="Bus Danay Express">
      </div>
    </section>

    <div id="zone"></div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script type="module" src="assets/admin.js"></script>
</body>
</html>
