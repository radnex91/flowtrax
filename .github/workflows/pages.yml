name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du format des messages
        run: npm test
      - name: Syntaxe des modules
        run: npm run check

  build:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Avertir si les clés Supabase ne sont pas renseignées
        run: |
          if grep -q "VOTRE-PROJET" public/assets/config.js; then
            echo "::warning::public/assets/config.js contient encore les valeurs d'exemple : l'application affichera un écran de configuration."
          fi

      - uses: actions/configure-pages@v5
        with:
          # Active Pages avec la source « GitHub Actions » s'il ne l'est pas
          # encore : sans ce réglage, le premier déploiement échoue sur une
          # case absente, ce qui se lit à tort comme une faute de code.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
